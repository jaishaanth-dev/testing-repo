<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Shop</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app">
      <header class="header">
        <div>
          <p class="eyebrow">Demo shop</p>
          <h1 id="title">Shop</h1>
          <p class="lede">Pick a product and add it to the cart.</p>
        </div>
        <p class="saved">Cart <span id="cart-count">0</span></p>
      </header>
      <nav class="nav">
        <a href="index.html">Shop</a>
        <a href="cart.html">Cart</a>
        <a href="orders.html">Orders</a>
        <a href="account.html">Account</a>
      </nav>
      <section class="card">
        <h2 id="title">Products</h2>
        <div class="products">
          <article class="product">
            <h3>Mug</h3>
            <p class="saved">$12</p>
            <label for="qty-mug">Quantity</label>
            <input id="qty-mug" type="number" value="1" min="1" />
            <button type="button" id="add-mug" data-id="mug" data-name="Mug" data-price="12">Add</button>
          </article>
          <article class="product">
            <h3>Cup</h3>
            <p class="saved">$8</p>
            <label for="qty-cup">Quantity</label>
            <input id="qty-cup" type="number" value="1" min="1" />
            <button type="button" id="add-cup" data-id="cup" data-name="Cup" data-price="8">Add</button>
          </article>
          <article class="product">
            <h3>Poster</h3>
            <p class="saved">$15</p>
            <label for="qty-poster">Quantity</label>
            <input id="qty-poster" type="number" value="1" min="1" />
            <button type="button" id="add-poster" data-id="poster" data-name="Poster" data-price="15">Add</button>
          </article>
        </div>
        <p class="saved" id="shop-status"></p>
      </section>
    </main>
    <script src="pages/home.js"></script>
  </body>
</html>
